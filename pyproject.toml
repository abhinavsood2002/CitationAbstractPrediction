[project]
name = "abstract-to-abstract"
version = "0.1.0"
description = "Abstract-to-abstract: anticipating the citing literature of a paper from its abstract"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "requests",
    "tqdm",
    "orjson",
    "sentence-transformers>=3.0",
    "sacrebleu>=2.4",
    "rouge-score",
    "matplotlib>=3.8",
    "langdetect>=1.0.9",
    "pysbd==0.3.4",  # abstract_sentence_result_removal: stored labels are per pysbd sentence
]

[project.optional-dependencies]
gen = ["vllm>=0.10"]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
include = ["a2a*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
